[project]
name = "svtplay-arr"
version = "0.1.0"
description = "A Newznab indexer and SABnzbd download client for Sonarr, backed by SVT Play."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Thim", email = "jonas.thim@gmail.com" }]
keywords = ["sonarr", "newznab", "sabnzbd", "svtplay", "svt", "indexer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Natural Language :: Swedish",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "svtplay-dl>=4.193",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "httpx2>=2.0"]

[project.urls]
Homepage = "https://github.com/jonasthim/svtplay-arr"
Repository = "https://github.com/jonasthim/svtplay-arr"
Issues = "https://github.com/jonasthim/svtplay-arr/issues"

[project.scripts]
svtplay-arr-suggest-mappings = "svtplay_arr.discovery:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svtplay_arr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits the real SVT API; needs a Swedish IP"]
addopts = "-m 'not integration'"
